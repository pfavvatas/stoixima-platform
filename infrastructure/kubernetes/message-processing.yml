apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-processing
  namespace: stoixima-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: message-processing
  template:
    metadata:
      labels:
        app: message-processing
    spec:
      containers:
        - name: message-processing
          image: ghcr.io/pfavvatas/stoixima-platform/message-processing:latest
          ports:
            - containerPort: 8081
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8081
            - name: Kafka__BootstrapServers
              valueFrom:
                configMapKeyRef:
                  name: stoixima-config
                  key: KAFKA_BOOTSTRAP
            - name: ConnectionStrings__Postgres
              value: Host=postgres;Port=5432;Database=stoixima;Username=stoixima;Password=$(POSTGRES_PASSWORD)
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stoixima-secrets
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__ClickHouse
              value: Host=clickhouse;Port=8123;Database=stoixima
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: message-processing
  namespace: stoixima-prod
spec:
  selector:
    app: message-processing
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: message-processing-hpa
  namespace: stoixima-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: message-processing
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
