global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: telegram-gateway
    static_configs:
      - targets: ["telegram-gateway:8081"]
    metrics_path: /metrics

  - job_name: storage-service
    static_configs:
      - targets: ["storage-service:8081"]
    metrics_path: /metrics

  - job_name: message-processing
    static_configs:
      - targets: ["message-processing:8081"]
    metrics_path: /metrics

  - job_name: match-data-service
    static_configs:
      - targets: ["match-data-service:8081"]
    metrics_path: /metrics

  - job_name: aggregation-service
    static_configs:
      - targets: ["aggregation-service:8081"]
    metrics_path: /metrics

  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:5000"]
    metrics_path: /metrics
