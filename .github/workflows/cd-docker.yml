name: CD — Build & Push Docker Images

on:
  push:
    branches: [master, main]
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/stoixima-platform

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: telegram-gateway
            dockerfile: infrastructure/docker/telegram-gateway/Dockerfile
          - name: storage-service
            dockerfile: infrastructure/docker/storage-service/Dockerfile
          - name: message-processing
            dockerfile: infrastructure/docker/message-processing/Dockerfile
          - name: match-data-service
            dockerfile: infrastructure/docker/match-data-service/Dockerfile
          - name: aggregation-service
            dockerfile: infrastructure/docker/aggregation-service/Dockerfile
          - name: api-gateway
            dockerfile: infrastructure/docker/api-gateway/Dockerfile
          - name: frontend
            dockerfile: src/frontend/Dockerfile
            context: src/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
